<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>NSS Content Admin</title>
  </head>
  <body>
    <!--
      Sveltia CMS admin (Git-based headless CMS, Decap-compatible).

      It is served as a plain static file by Vercel — no server required.
      The backend, repository, branch and content collections are defined in
      config.yml (loaded automatically from this same /admin/ folder).

      Authentication: GitHub. Editors sign in with a fine-grained access token
      (see docs/ADMIN_SETUP.md). No OAuth secret is stored in this page or the
      config — the token lives only in the editor's browser session.
    -->
    <script src="https://unpkg.com/@sveltia/cms/dist/sveltia-cms.js"></script>
    <!-- Custom theme (loaded after the bundle so it wins the cascade) -->
    <link rel="stylesheet" href="custom.css" />
  </body>
</html>
